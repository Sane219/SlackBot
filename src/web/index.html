<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SlackBot</title>
    <link rel="stylesheet" href="/app.css" />
    <!-- Inline, so the browser's automatic /favicon.ico request does not 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0b0d'/%3E%3Crect x='2' y='3' width='2' height='10' fill='%23ffb020'/%3E%3Crect x='6' y='7' width='8' height='1' fill='%234a9eff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      The same board in both modes: a code column on the left, the work on the right.
      Setup rows read LLM / SLK / GH; the Inbox reads one row per Fire. An operations
      board shows every channel's state at once, because a responder who has to open a
      drawer to check one line does not check it (ADR-0008).
    -->
    <div class="board">
      <aside class="spine" aria-label="Status">
        <div class="spine__label" id="spine-label">Channel</div>
        <div id="spine-rows" role="status" aria-live="polite">
          <div class="fire">
            <span class="fire__rule" aria-hidden="true"></span>
            <div class="fire__name">connecting…</div>
          </div>
        </div>
      </aside>

      <main class="pane">
        <header class="pane__head">
          <h1 class="pane__title" id="pane-title">Inbox</h1>
          <div class="window" id="window-label"></div>
        </header>

        <nav class="tabs" role="tablist" aria-label="Sections">
          <button class="tab" role="tab" data-view="inbox" aria-selected="true">Inbox</button>
          <button class="tab" role="tab" data-view="jobs" aria-selected="false">Jobs</button>
          <button class="tab" role="tab" data-view="setup" aria-selected="false">Setup</button>
        </nav>

        <!-- Inbox -->
        <section id="view-inbox" class="view">
          <div id="draft-host"></div>
        </section>

        <!-- Jobs -->
        <section id="view-jobs" class="view" hidden>
          <div class="prose" id="jobs-host"></div>
          <div class="plan">
            <h2 class="step__label">Describe your routine</h2>
            <p class="step__note">
              In your own words: what you post, how often, and what each one covers. The
              model proposes; you confirm before anything is scheduled.
            </p>
            <label class="sr-only" for="routine">Describe your posting routine</label>
            <textarea id="routine" rows="4" placeholder="I post a day task at 9:30, a progress update around 2:30, and a day summary before I leave. All in #coot-ai. Times are IST."></textarea>
            <div class="actions">
              <button class="btn btn--approve" id="plan-btn" type="button">Propose jobs</button>
              <div id="plan-result" class="step__note" role="alert"></div>
            </div>
          </div>
        </section>

        <!-- Setup -->
        <section id="view-setup" class="view" hidden>
          <div class="steps" id="setup-rows"></div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
