<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SlackBot</title>
    <!--
      A link, not a JS import. Vite inlines CSS imported from a module into the bundle
      and injects it at runtime, which means a white flash on a board whose whole ground
      is near-black. The stylesheet has to be in the first paint.
    -->
    <!--
      Inline, so the browser's automatic /favicon.ico request does not 404. Three
      vertical bars: two amber Fires and one dim upcoming, which is the whole board.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0b0d'/%3E%3Crect x='2' y='2' width='2' height='5' fill='%23ffb020'/%3E%3Crect x='2' y='9' width='2' height='5' fill='%23ffb020'/%3E%3Crect x='6' y='7' width='8' height='2' fill='%231b3a3f'/%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="/assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/app.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
